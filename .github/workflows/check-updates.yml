name: "🔍 Check Source Updates"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: "🔍 Check upstream versions"
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "🔍 Fetch and compare upstream versions"
        id: versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-sources.sh

      - name: "📌 Update source-pins.json"
        if: env.HAS_UPDATE == 'true'
        run: |
          jq -n \
            --arg moto       "$CHECK_MOTO_SUB" \
            --arg moto_sha   "$CHECK_MOTO_COMMIT" \
            --arg lts_base   "$CHECK_GKI_LTS_BASE" \
            --arg lts_sha    "$CHECK_GKI_LTS_COMMIT" \
            --arg ksun       "$CHECK_KSUN_TAG" \
            --arg susfs      "$CHECK_SUSFS_TAG" \
            --arg susfs_kver "$CHECK_SUSFS_KERNEL_VER" \
            --arg wild       "$CHECK_WILDKERNELS_COMMIT" \
            '{
              moto_sublevel:        $moto,
              moto_commit:          $moto_sha,
              gki_lts_base_commit:  $lts_base,
              gki_lts_commit:       $lts_sha,
              ksun_tag:             $ksun,
              wildkernels_commit:   $wild,
              susfs_tag:            $susfs,
              susfs_kernel_version: $susfs_kver
            }' > sources/source-pins.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/source-pins.json
          git commit -m "chore: update source pins (${CHECK_MOTO_SUB}) [skip ci]"
          git push

      - name: "📤 Export build trigger flag"
        id: flags
        run: echo "should_build=${SHOULD_BUILD:-false}" >> "$GITHUB_OUTPUT"

      - name: "telegram report"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID || vars.TELEGRAM_TOPIC_ID }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash scripts/notify.sh check

  auto-build:
    name: "🚀 Auto-build updated kernel"
    needs: [check]
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build-aio.yml
    with:
      zip_mode: per-variant
      build_type: stable
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID }}
